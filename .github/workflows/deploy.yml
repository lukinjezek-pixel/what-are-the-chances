name: Deploy website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Find project
        run: |
          echo "Projects found:"
          find project -name package.json -print

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build Next.js project
        run: |
          PROJECT=$(dirname "$(find project -name package.json | head -n 1)")
          cd "$PROJECT"

          node -e "let fs=require('fs');let f='next.config.mjs';let s=fs.readFileSync(f,'utf8');if(!s.includes(\"output: 'export'\")){s=s.replace('const nextConfig = {', \"const nextConfig = {\\n  output: 'export',\");fs.writeFileSync(f,s)}"

          pnpm install --frozen-lockfile
          pnpm build

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -r out/. "$GITHUB_WORKSPACE/out/"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
